# Weekly update requests for packages with fixes. Security fixes open on their own as soon as
# they're published. Every update request runs the full test suite (ci.yml) before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (e.g. TypeScript 7, Tailwind 4) change how the app is built and need a
    # planned upgrade, so they aren't proposed automatically. Security fixes still are.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
