name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rule tests
        run: npm run test:unit && npm run test:rules
      - name: Database tests (all migrations + integrity rules on Postgres)
        run: npm run test:db
      - name: Build the demo
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: '1'
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Click-through test
        run: |
          npx next start -p 3200 &
          for i in $(seq 1 60); do curl -sf http://localhost:3200 >/dev/null && break; sleep 1; done
          npm run test:e2e
          npm run test:sweep
        env:
          NEXT_PUBLIC_DEMO_MODE: '1'
